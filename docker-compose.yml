version: '3.8'

services:
  agrismart-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrismart_ai_server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - RATE_LIMIT_ENABLED=true
    volumes:
      - agrismart_data:/app/data
      - agrismart_uploads:/app/app/isolated_uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  agrismart_data:
  agrismart_uploads:
